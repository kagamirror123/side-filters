name: CI

on:
  push:
    branches: [main]
    # zip を作る release ジョブはタグ push から始まる。ここに tags が無いと到達しない
    tags: ["v*"]
  pull_request:

# 既定を読み取りだけにする。書き込みが要るジョブでだけ足す
permissions:
  contents: read

# third-party Action は可変タグではなく commit SHA で固定する（横のコメントが元のバージョン）

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: npm ci
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm run typecheck
      # manifest のテストが production build の出力を読むので、test より前に build する
      - run: npm run build
      - run: npm run test

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: npm ci
      # 同じバージョンは Chrome ウェブストアへ再アップロードできない。取り違えをここで落とす
      - name: tag と package.json の version が一致するか
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} と package.json の version ${pkg} が一致しません"
            exit 1
          fi
      - run: npm run zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: side-filters-${{ github.ref_name }}
          path: .output/*.zip
          # .output は隠しディレクトリ。upload-artifact は既定で隠しファイルを除くので明示する
          # （v1.0.0 のタグで「No files were found」になった）
          include-hidden-files: true
          if-no-files-found: error
